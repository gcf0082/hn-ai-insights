# HN AI 文章匹配配置
# 支持多种匹配模式：exact, icontains, word, regex

# 匹配模式说明:
# - exact: 精确匹配（区分大小写）
# - icontains: 包含匹配（不区分大小写）
# - word: 单词匹配（\bkeyword\b，区分大小写）
# - iword: 单词匹配（\bkeyword\b，不区分大小写）
# - regex: 正则表达式匹配

# AI 关键词配置
ai_keywords:
  # 不区分大小写的包含匹配（最宽松）
  - pattern: "artificial intelligence"
    mode: icontains
  - pattern: "machine learning"
    mode: icontains
  - pattern: "deep learning"
    mode: icontains
  - pattern: "neural network"
    mode: icontains
  
  # 单词匹配（避免匹配到包含该词的其他词）
  - pattern: "llm"
    mode: iword
  - pattern: "gpt"
    mode: iword
  - pattern: "claude"
    mode: iword
  - pattern: "anthropic"
    mode: iword
