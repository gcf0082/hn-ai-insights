# 特殊规则配置
special_rules:
  # agent 需要 AI 上下文才匹配
  - keyword: "agent"
    require_context: ["ai", "llm", "model", "autonomous", "coding", "local", "sandbox"]
    mode: iword
  - keyword: "agents"
    require_context: ["ai", "llm", "model", "autonomous", "coding", "local", "sandbox"]
    mode: iword

# 全局配置
config:
  # 最小分数过滤
  min_points: 30
  # 最大抓取页数
  max_pages: 5
  # 是否启用特殊规则
  enable_special_rules: true
  # 匹配模式：any（任一匹配即可）/ all（全部匹配）
  match_mode: any
